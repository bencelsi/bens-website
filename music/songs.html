<!DOCTYPE html>
<head>
	<title>Ben's Website!!!</title>
	<link rel='icon' type='image/x-icon' href='../shared/favicon.ico'>
	<link rel="stylesheet" href="../shared/shared.css">
	<style type="text/css">
		audio { height: 30px; width: 250px; }

		.row { display: table; }
		
		#albumCover {
			width: 250px; height: 250px; 
			filter: drop-shadow(0 0 4.5rem rgb(0, 79, 136));
		}

		#songs { margin-left: auto; margin-right: auto; }

		td {
			color:rgb(119, 171, 255);
			text-align: left;
			text-shadow: 0 0 30px rgb(0, 0, 0);
			filter: drop-shadow(0 0 .5rem rgb(0, 0, 0));
		}
	</style>
</head>
<body>
	<div id="AllSongs">
		<br>
		<img id="albumCover">
		<h1 id="title"></h1>
		<h3 id="totalLength"></h3>
		<!-- 'https://raw.githubusercontent.com/bencelsi/bencelsi.github.io/master/music/.mp3' -->
		<br><br>
		<table id="songs">
		</table><br>
		<!-- <div>
			<img src="../shared/gif/arrowl.gif" class="button" id="left"/>
			<img src="../shared/gif/arrowr.gif" class="button" id="right"/>
		</div> -->
		<br>
		Autoplay <input type="checkbox" id="autoplay" checked/>
		Shuffle <input type="checkbox" id="shuffle"/><br><br>
	<div><br><br>
<script src="../shared/shared.js"></script>
<script src="songTable.js"></script>
<script>
/* 
TODO: dynamically add script based on query param?
TODO: show image corresponing to song (if applicable)
TODO: maybe just store separate groups as separate CSVs? easier to edit, easier to code...
TODO - way to keep playing song when browsing website?

All - view 'newest' version of all bounces
All All - view all, including old versions
rename song files & logic
*/

const autoplayBox = get("autoplay"); 
const shuffleBox = get("shuffle")
const songDiv = get("songs")
const titleDiv = get("title")
const albumCover = get("albumCover")
const totalLengthDiv = get("totalLength")

autoplayBox.onclick = () => { if (!autoplayBox.checked) shuffleBox.checked = false }
shuffleBox.onclick = () => { if (shuffleBox.checked) autoplayBox.checked = true }

const GROUP_COL = 2
let q = new URLSearchParams(window.location.search).get('q')

let groupConfig = {
	'podcasts': 		['Podcast Music', 'breathe.jpg'],
	'dxarts': 			['DXARTS', 'dxarts.png'],
	'griven': 			['Griven Music', 'griven.png'],
	'instrumentals': 	['Instrumentals', 'Teapots.png'],
	'mashups': 			['Mashups', 'Mashups.jpg'],
	'miscellaneous': 	['Teapots', 'Teapots.png'],
	'oldPiano': 		['Old Piano', 'piano.png'],
	'rebeccasAnimations':['Music for Animations'],
	'songs': 			['Songs', 'Songs.jpg'],
	'topBounces': 		['Top Bounces', 'Moss Rock.png'],
	'looplike':			['Loop Like', 'Greenery.JPG'],
	'shorts':			['Shorts', 'Greenery.JPG']
}

// find group image
if (groupConfig[q] != null) {
	albumCover.src = "groupImages/" + groupConfig[q][1]
	document.title = groupConfig[q][0]
	titleDiv.innerHTML = groupConfig[q][0]
}


let songDatas = [];
// filter to songs in given group
for (let i = 0; i < songTable.length; i++) {
	let row = songTable[i]
	if (q == row[GROUP_COL] || q == 'all') songDatas.push(row)
}

let songAudios = []

// shuffle or sort by tracklist
if (songDatas[0][4] == null) { shuffle(songDatas) }
else { songDatas.sort((a, b) => { return a[4] - b[4] }) }

for (let i = 0; i < songDatas.length; i++) {
	addSong(songDatas[i], i)
}

let totalLength = 0

displayTotal()

function addSong(songData, i) {
	let [title, extension, group, key, track, youtube, chords, image] = songData
	
	let songNumber = document.createElement("td")
	songNumber.innerHTML = i + 1 + "."
	let songTitle = document.createElement("td")
	songTitle.innerHTML = title
	let songAudioTd = document.createElement("td")
	let songAudio = document.createElement("audio")
	songAudio.src = "groups/" + group + "/" + title + '.' + extension
	console.log(songAudio.src)
	songAudio.controls = true

	// PLAY
	songAudio.addEventListener("play", () => { 
		for (let j = 0; j < songAudios.length; j++) {
			if (j == i) continue
			songAudios[j].id = "unselected"
			songAudios[j].pause()
		}
		songAudios[i].id = "highlighted"
	})

	// PAUSE
	songAudio.addEventListener("pause", () => { 
		songAudios[i].id = "unselected"
	})

	songAudio.addEventListener("ended", () => {
		if (!autoplayBox.checked) return
		//songAudios[i].currentTime = 0
		let nextIndex = i + 1;
		if (shuffleBox.checked) {
			nextIndex = i
			while (nextIndex == i) nextIndex = random(0, songAudios.length - 1)
		}
		if (shuffleBox.checked || nextIndex < songAudios.length) {
			songAudios[nextIndex].currentTime = 0
			songAudios[nextIndex].play()
		}
    })

	// GET LENGTH
	songAudio.addEventListener('loadedmetadata', function() {
		totalLength += songAudio.duration;
    });

	songAudios.push(songAudio)
	songAudioTd.appendChild(songAudio)
	
	let row = document.createElement("tr")
	//row.appendChild(songNumber) // make configurable?
	row.appendChild(songTitle)
	row.appendChild(songAudioTd)
	songDiv.appendChild(row)
}

</script>
</body>
</html>
