<!DOCTYPE html>
<head>
	<title>Ben's Website!!!</title>
	<link rel='icon' type='image/x-icon' href='../shared/favicon.ico'>
	<link rel="stylesheet" href="../../shared/shared.css">
	<style type="text/css">
		
		#all {
			position: relative;
			width: fit-content; /* Shrinks to the images’ size */
			margin: 0 auto;     /* Centers the container */
		}

		.img {
			display: block;
			width: 200px; /* Example size */
		}

		#book {
			height: 500px;
			position: relative; /* Base */
			z-index: 1;
		}

		.tab {
			position: absolute;
			top: 0;       /* Adjust to overlap more/less */
			left: 0;
			z-index: 2;   /* On top */	
			display: none;
		}

		#tab1 {
			width: 380px;
			transform: translate(var(--x, 360px), var(--y, 120px));
		}
		#tab2 {
			width: 370px;
			transform: translate(var(--x, 375px), var(--y, 250px));
		}
		#tab3 {
			width: 440px;
			transform: translate(var(--x, 340px), var(--y, 360px));
		}
	</style>
</head>

<body>
	<br>
	<!-- <a href="../index.html?tab=art" id="home">hm</a> -->
	<h1 style="color: purple;" id="title">Generate Your Own River-Related Art Project Idea<h1>
	<div id = "all">
		<img id="book" src="images/pages/0.jpeg"/>
		<img id="tab1" class = "tab" src="images/tab1/0.png"/>
		<img id="tab2" class = "tab" src="images/tab2/0.png"/>
		<img id="tab3" class = "tab" src="images/tab3/0.png"/>
	</div>
	<br>

	<img src="../../gif/random.gif" id="randomButton"/>

<script src="../../shared/shared.js"></script>
<script>
	const BOOK = get('book');
	const TABS = [get('tab1'), get('tab2'), get('tab3')]

	let tabVals = [0, 0, 0]
	let maxTabVals = [8, 10, 9]

	let page = 0
	BOOK.onclick = function(event) {
		midPoint = page == 1 ? 450 : 540
		let x = relavativeX(event)
		if (page == 0 || x > midPoint) page = Math.min(page + 1, 8)
		else page = Math.max(page - 1, 0)
		updatePage()
		updateTabVisibility()
	}

	for (let i = 0; i <= 2; i++) {
		let tab = TABS[i]
		tab.onclick = (event) => {
			let x = relavativeX(event)
			if (x > 190) tabVals[i] = Math.min(tabVals[i] + 1, maxTabVals[i])
			else tabVals[i] = Math.max(tabVals[i] - 1, 0)
			updateTab(i)
		}
	}


	get('randomButton').onclick = () => {
		for (let i = 0; i < 3; i++) {
			tabVals[i] = random(0, maxTabVals[i])
			updateTab(i)
		}
		page = random(1, 9)
		updatePage()
		updateTabVisibility()
	} 

	function updatePage() {
		BOOK.src = "images/pages/" + page + ".jpeg"
	}

	function updateTab(i) {
		TABS[i].src = "images/tab" + (i + 1) + "/" + tabVals[i] + ".png"
	}

	function updateTabVisibility() {
		for (let i = 0; i <= 2; i++) {
			let tab = TABS[i]
			tab.style.display = page == 0 ? 'none' : 'block'
		}
	}

	function relavativeX(e) {
		var rect = e.target.getBoundingClientRect();
		return e.clientX - rect.left; //x position within the element.
	}

</script>
</body>
