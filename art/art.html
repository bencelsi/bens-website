	<div>
		<h1 style="color: purple;" id="title"><h1>
		<div><img id="artScreen"/></div>
		<div>
			<img src='../gif/arrowl.gif' class=button id="left"/>
			<img src="../gif/random.gif" class=button id="random"/>
			<img src='../gif/arrowr.gif' class=button id="right"/>
		</div>
	</div>
<script src="../shared/shared.js"></script>
<script src="artTable.js"></script>
<script>

// TODO: show painting name
// Combine seattle candidates into one?

const CLICK = '../shared/sound/click.wav'

//let images, q, title
const FILENAME_COL = 0, GROUP_COL = 1

let q = new URLSearchParams(window.location.search).get('q')

let images = [];
for (let i = 0; i < artTable.length; i++) {
	let row = artTable[i]
	if (row[GROUP_COL] == q || q == 'all') images.push(row)
}

console.log(q)

//get("title").innerHTML = title
let index = 0
//if (config[q][2]) shuffle(images)

get("left").onclick = () => {
	playSound(CLICK, .5); index = decrement(index, images.length - 1); setImage(); console.log(images[index])
}

get("right").onclick = () => {
	playSound(CLICK, .5); index = increment(index, images.length - 1); setImage()
}	

get("random").onclick = () => {
	playSound(CLICK, .5); index = random(0, images.length - 1); setImage()
}

function setImage() {
	get('artScreen').src = 'groups/' + q + "/" + images[index][FILENAME_COL]
}

setImage()
</script>
</body>
