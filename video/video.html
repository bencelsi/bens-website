<!DOCTYPE html>
<head>
	<title style='color: white'>Videos!</title>
	<link rel='icon' type='image/x-icon' href='../shared/favicon.ico'>
	<link rel="stylesheet" href="../shared/shared.css">
	<style type='text/css'>

		iframe { border: 0px; filter: drop-shadow(0 0 5rem rgb(78, 78, 78)) }

		/* #videoScreen { height: 480px; width: 854px; } */

	</style>
</head>
<body>
<br><br>
<div>
	<div>
		<h2 id='title'></h2><br>
		<iframe id=youtubeScreen width=1152 height=648 referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe> <!-- (.9 * 720 x 1280) -->
		<video id='hostedScreen' width=1280 height='720' controls><source type='video/mp4'></video>
		<br>
	</div>
	<br>
	<img class='button' src='../shared/gif/arrowl.gif' id='left'/>
	<img class='button' src='../shared/gif/random.gif' id='random'/>
	<img class='button' src='../shared/gif/arrowr.gif' id='right'/>
	<br><br>
</div>
<script src='../shared/shared.js'></script>
<script src='videoTable.js'></script>
<script>
// TODO: host everything with https://git-lfs.com/
// TODO: host everything, add 'thumbnails'

const EMBED_URL = 		'https://youtube.com/embed/'
const VIDEO_SCREEN = 	get('hostedScreen')
const YOUTUBE_SCREEN = 	get('youtubeScreen')
const LEFT_BUTTON = 	get('left')
const RIGHT_BUTTON =	get('right')
const RANDOM_BUTTON = 	get('random')
const TITLE = 			get('title')

// Metadata Columns

const TITLE_COL = 0, KEY_COL = 1, EXT_COL = 2, YT_COL = 3, GROUP_COL = 4, YEAR_COL = 5;

let query = new URLSearchParams(window.location.search).get('q')

let videos = [];
for (let i = 0; i < videoTable.length; i++) {
	let row = videoTable[i]
	if (query == row[GROUP_COL] || query == 'ALL') videos.push(row)
}

console.log(videos)
let index = 0; 
//shuffle(videos); 
setVideo()

LEFT_BUTTON.onclick = () => { index = decrement(index, videos.length - 1); setVideo() }
RIGHT_BUTTON.onclick = () => { index = increment(index, videos.length - 1); setVideo() }
RANDOM_BUTTON.onclick = () => { index = random(0, videos.length - 1); setVideo() }

function setVideo() {
	console.log(videos)
	let video = videos[index]
	let isYoutube = video[YT_COL] != ''
	
	if (isYoutube) YOUTUBE_SCREEN.src = EMBED_URL + videos[index][YT_COL]
	else VIDEO_SCREEN.src = 'videos/' + videos[index][KEY_COL] + "." + videos[index][EXT_COL]
	
	VIDEO_SCREEN.style.display = isYoutube ? 'none' : 'inline-block'
	YOUTUBE_SCREEN.style.display = isYoutube ? 'inline-block' : 'none'
	TITLE.innerHTML = videos[index][TITLE_COL]
}

</script>
</body>
